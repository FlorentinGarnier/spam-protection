name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issue?** Do not open a public issue: report it privately, as described in SECURITY.md.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `composer show florentingarnier/spam-protection | grep versions`
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.12"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Include the rejection reason (`reason` in the logs) if a submission was rejected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code sample or steps that reproduce the problem.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, stack trace, configuration, browser (for the JavaScript solver)…
